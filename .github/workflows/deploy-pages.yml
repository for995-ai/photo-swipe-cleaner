name: Deploy showcase to GitHub Pages

# Publishes the static project showcase in /showcase.
# The app itself is React Native and has no web build — this is a project
# introduction page, not a web port.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
